# Production compose — stateless replicas pointing at managed Postgres + Redis.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prereqs:
#   - .env.prod with all required vars (see x-env-docs below)
#   - Managed Postgres with pgvector extension enabled
#   - Managed Redis (ElastiCache, Upstash, etc.)
#
# Deploy order:
#   1. Run `migrate` service first (one-shot)
#   2. Scale `api` to desired replica count
#   3. `worker` and `beat` start automatically

x-env-docs:
  # Required in .env.prod:
  #   DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/memonative
  #   REDIS_URL=redis://:password@host:6379/0
  #   API_KEY=<master bearer token>
  #   OPENAI_API_KEY=<for embeddings>
  #   DEEPSEEK_API_KEY=<for engine LLM>
  #
  # Optional:
  #   MASTER_ENCRYPTION_KEY=<fernet key for per-tenant keys>
  #   DEEPSEEK_BASE_URL=https://api.deepseek.com/v1

x-common: &common
  build:
    context: .
    target: runtime
  env_file: .env.prod
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  migrate:
    <<: *common
    build:
      context: .
      target: migrate
    restart: "no"
    deploy:
      replicas: 1

  api:
    <<: *common
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *common
    build:
      context: .
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  beat:
    <<: *common
    build:
      context: .
      target: beat
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
