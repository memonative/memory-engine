# Self-host compose — full stack with local Postgres+pgvector and Redis.
#
# For production, see docker-compose.prod.yml: same images, but pointed at
# managed Postgres and Redis with replicas and resource limits.

services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=memonative
      - POSTGRES_PASSWORD=memonative
      - POSTGRES_DB=memonative
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memonative -d memonative"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    command: uvicorn memonative.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://memonative:memonative@db:5432/memonative
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - API_KEY=${API_KEY:-}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:-}
    volumes:
      - ./src:/app/src

  worker:
    build:
      context: .
      target: worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://memonative:memonative@db:5432/memonative
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:-}

  beat:
    build:
      context: .
      target: beat
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://memonative:memonative@db:5432/memonative
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data:
