[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memonative-client"
version = "0.1.0"
description = "Python client for the Memonative memory engine HTTP API."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Amaymani" },
    { name = "Freak3123" },
]
license = "MIT"
license-files = ["LICENSE"]

# MIT, unlike the BSL-licensed engine this talks to: a client gets vendored
# into someone else's application, and a source-available licence there is a
# reason for their legal team to say no. Nothing in this package is the
# engine — it is request building and response parsing.
#
# Deliberately two dependencies. The whole point of shipping this separately
# is that an app which only *calls* the engine should not install asyncpg,
# celery, redis and alembic to do it.
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/memonative/memory-engine"
Repository = "https://github.com/memonative/memory-engine"
Issues = "https://github.com/memonative/memory-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]
